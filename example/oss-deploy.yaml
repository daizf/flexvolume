apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: nginx-oss-deploy
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-flexvolume-oss
        image: nginx
        volumeMounts:
          - name: "oss1"
            mountPath: "/data"
      volumes:
        - name: "oss1"
          flexVolume:
            driver: "ecloud/oss"
            options:
              bucket: "sigma-data"
              endpoint: "eos.hubei-3-internal.cmecloud.cn"
              otherOpts: "-o max_stat_cache_size=0 -o allow_other"
              akId: ""
              akSecret: ""
